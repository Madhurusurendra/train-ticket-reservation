name: java maven CI

on:
  push:
    branches: [master]
  pull_requst:
    branches: [master]

jobs:
  build:
     runs-on: ubuntu-latest

     steps:
       -  name: checkout code
          uses: actions/checkout@v4

       -  name: set up jdk
          uses: actions/setup-java@v4
          with:
             distribution: temurin
             java-version:  '17'
             cache: maven

        - name: build with maven
          run: mvn -b clean verify
