
name: Multi-Environment CI-CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select deployment environment
        required: true
        type: choice
        options:
          - DEV
          - TEST
          - PRE-PROD
          - PROD

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build WAR
        run: mvn clean package -DskipTests

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: Train-Ticket-WAR
          path: target/*.war

  deploy-selected:
    needs: build
    runs-on: self-hosted

    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: Train-Ticket-WAR

      - name: Deploy WAR to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/trainkey
          chmod 600 ~/.ssh/trainkey

          WAR_FILE=$(find . -name '*.war' -print -quit)
          test -n "$WAR_FILE"

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          scp -i ~/.ssh/trainkey "$WAR_FILE" ubuntu@"$EC2_HOST":/tmp/train-ticket-reservation.war

          ssh -i ~/.ssh/trainkey ubuntu@"$EC2_HOST" \
            "sudo systemctl stop tomcat; sudo rm -rf /opt/tomcat/webapps/train-ticket-reservation; sudo mv /tmp/train-ticket-reservation.war /opt/tomcat/webapps/train-ticket-reservation.war; sudo chown tomcat:tomcat /opt/tomcat/webapps/train-ticket-reservation.war; sudo systemctl start tomcat; sudo systemctl is-active tomcat"
