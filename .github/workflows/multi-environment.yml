name: Multi Environment Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select deployment environment
        required: true
        type: choice
        options:
          - DEV
          - TEST
          - PRE-PROD
          - PROD

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Check Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build WAR File
        run: mvn -B clean package

      - name: Find WAR File
        run: |
          find target -maxdepth 1 -type f -name "*.war"

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SERVER: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER" >> ~/.ssh/known_hosts

      - name: Copy WAR to EC2
        env:
          SERVER: ${{ secrets.EC2_HOST }}
        run: |
          WAR_FILE=$(find target -maxdepth 1 -type f -name "*.war" ! -name "original-*.war" | head -n 1)
          test -n "$WAR_FILE"
          scp -i ~/.ssh/deploy_key "$WAR_FILE" ubuntu@"$SERVER":/home/ubuntu/app.war

      - name: Deploy to Tomcat
        env:
          SERVER: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@"$SERVER" << 'EOF'
            sudo systemctl stop tomcat
            sudo rm -rf /opt/tomcat/webapps/ROOT
            sudo rm -f /opt/tomcat/webapps/ROOT.war
            sudo cp /home/ubuntu/app.war /opt/tomcat/webapps/ROOT.war
            sudo chown tomcat:tomcat /opt/tomcat/webapps/ROOT.war
            sudo systemctl start tomcat
            sudo systemctl is-active tomcat
          EOF

      - name: Deployment Completed
        run: echo "Deployment to ${{ inputs.environment }} completed"
